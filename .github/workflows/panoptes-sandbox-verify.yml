name: verify Panoptes Archotraz sandbox

on:
  push:
    branches:
      - sandbox/panoptes-archotraz-evidence-20260927

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
