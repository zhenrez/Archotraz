[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "archotraz"
version = "0.1.0"
description = "Evidence-first repository processor and recombination workbench"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
archotraz = "archotraz.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
